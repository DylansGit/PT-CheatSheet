<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penetration Testing Cheatsheet</title>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" />

    <!-- Scripts -->
    <script src="/static/main.js" defer></script>
</head>

<body style="overflow:visible;">

    <div class="container">
        <!-- 🔺 Top Bar with logo + search -->
        <div class="top-bar">
            <!-- Logo links to home -->
            <a href="/" onclick="if(window.showHomePage){ showHomePage(); return false; }" aria-label="PT-CS Home">
                <img src="/static/ptcs-logo.png" alt="PT-CS" class="ptcs-logo">
            </a>

            <!-- 🔍 Simple Search Bar -->
            <div id="search-wrapper" style="display:flex;justify-content:flex-end;gap:8px;margin:10px 0;position:relative;z-index:5;">
                <input id="site-search" placeholder="Search..."
                       style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:#eee;
                              padding:6px 10px;border-radius:6px;min-width:240px;">
                <button id="search-clear"
                        style="background:transparent;border:none;color:#aaa;margin-left:6px;cursor:pointer;font-size:16px;">✕</button>
            </div>
        </div>

        <!-- dropdown results -->
        <div id="search-results"
             style="display:none;position:absolute;right:25px;top:70px;background:#0a0a0a;
                    border:1px solid #222;border-radius:8px;max-width:450px;max-height:60vh;
                    overflow:auto;z-index:10;padding:8px;">
            <div id="search-results-list"></div>
            <div style="padding:6px;font-size:12px;color:#9aa0a6;">Press Esc to close</div>
        </div>

        <!-- Line Animation Wrapper -->
        <div class="line-animation-wrapper">
            <div class="line-animation left"></div>
            <div class="line-animation right"></div>
        </div>

        <!-- Main Tabs -->
        <div class="tab-container">
            <div class="tab active" onclick="showTab('toolscheatsheet')">Tools Cheatsheet</div>
            <div class="tab" onclick="showTab('portswiggercheatsheet')">PortSwigger Cheatsheet</div>
            <div class="tab" onclick="showTab('windowsprivesc')">Windows PrivEsc</div>
            <div class="tab" onclick="showTab('linuxprivesc')">Linux PrivEsc</div>
            <div class="tab" onclick="showTab('imagescheatsheet')">Images Cheatsheet</div>
            <div class="tab" onclick="showTab('topics')">Topics</div>
            <div class="tab" onclick="showTab('resources')">Resources</div>
        </div>

        <!-- Button Container -->
        <div class="button-container">
            <!-- Collapse All Button -->
            <div class="collapse-all-container">
                <button class="collapse-all-btn" onclick="collapseAllRows()">Collapse</button>
            </div>

            <!-- Back to Top Button -->
            <a href="#" class="back-to-top" onclick="scrollToTop()">&#8679;</a>
        </div>

        <!-- Dynamic Content Area -->
        <div id="tab-content" class="tab-content active">
            <!-- Loaded tab content appears here -->
        </div>
    </div>

</body>
</html>
